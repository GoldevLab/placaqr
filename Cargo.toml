[package]
name = "qr3d"
version = "0.1.0"
edition = "2021"

[dependencies]
resuma = { git = "https://github.com/GoldevLab/resuma.git", rev = "36527ae1c1a8fb31d0e3cec3d3abcc9975ba2f7c" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
