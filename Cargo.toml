[package]
name = "qr3d"
version = "0.1.0"
edition = "2021"

[dependencies]
resuma = "1.3.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
